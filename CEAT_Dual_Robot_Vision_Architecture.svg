ze="17" font-weight="bold" text-anchor="start" x="1405" y="323">Robot handshake</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="349">Read position and checkpoint ID.</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="370">Validate request token; respond once.</text><circle cx="1377" cy="419" fill="#268968" r="17" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1377" y="425">03</text><text fill="#17243C" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="1405" y="420">4K acquisition timing</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="446">Position reached ≠ line trigger.</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="467">Encoder drives line acquisition.</text><circle cx="1377" cy="516" fill="#268968" r="17" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1377" y="522">04</text><text fill="#17243C" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="1405" y="517">Image verification</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="543">Check image size, frames, metadata.</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="564">Do not accept a partial capture.</text><circle cx="1377" cy="613" fill="#B87A19" r="17" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1377" y="619">05</text><text fill="#17243C" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="1405" y="614">Robot result response</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="640">Write result and matching token;</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="661">set VALID only after data.</text><circle cx="1377" cy="710" fill="#B87A19" r="17" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1377" y="716">06</text><text fill="#17243C" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="1405" y="711">Storage / traceability</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="737">Save five images against one cycle.</text><text fill="#5F6E84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1405" y="758">Preserve partial / failed cycles.</text><rect fill="#FEF5E8" height="153" rx="10" ry="10" stroke="#E8CB9C" stroke-width="1.7" width="388" x="1353" y="810" /><text fill="#A06313" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="1370" y="838">ENGINEERING BOUNDARIES</text><text fill="#6C563B" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1370" y="862">• Safety control stays in certified cell</text><text fill="#6C563B" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="1370" y="882">  safety circuits / robot controllers.</text><text fill="#6C563B" font-family=